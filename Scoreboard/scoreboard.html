<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulldog Olympics Scoreboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Graduate&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    <style>

        :root {
            --maroon:      #7a0019;
            --maroon-dark: #5a0012;
            --gold:        #ffcc33;
            --white:       #ffffff;
            --border:      2.5px solid rgba(255,255,255,0.85);
            --card-gap:    5px;
            --card-radius: 8px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Oswald', sans-serif;
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── 16:9 canvas always renders at 1920×1080, scales to fit any screen ── */
        .scale-root {
            width: 1920px;
            height: 1080px;
            transform-origin: top left;
            position: absolute;
            background: var(--maroon);
            border: var(--border);
            overflow: hidden;
        }

        /* ── PAGE GRID ── */
        .page {
            display: grid;
            grid-template-rows: 140px 1fr;
            width: 100%;
            height: 100%;
        }

        /* ══════════════════════════════════════
           HEADER
        ══════════════════════════════════════ */
        .header {
            position: relative;
            display: grid;
            grid-template-columns: 200px 1fr 320px;
            align-items: center;
            border-bottom: var(--border);
            background: linear-gradient(180deg, #5a0012 0%, var(--maroon) 100%);
            padding: 0 28px;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                -55deg, transparent, transparent 18px,
                rgba(255,204,51,0.04) 18px, rgba(255,204,51,0.04) 19px
            );
            pointer-events: none;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .header-logo {
            height: 100px;
            object-fit: contain;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.6));
            position: relative;
            z-index: 1;
        }

        .header-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title {
            font-family: 'Graduate', sans-serif;
            font-size: 5.2rem;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--gold);
            -webkit-text-stroke: 1.5px #fff;
            text-shadow: 6px 6px 14px rgba(0,0,0,0.9);
            position: relative;
            z-index: 1;
            line-height: 1;
        }

        .header-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .clock-time {
            font-family: 'Graduate', sans-serif;
            font-size: 4.8rem;
            color: var(--gold);
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
            letter-spacing: 1px;
            line-height: 1;
            white-space: nowrap;
        }

        /* date — bottom-right corner of whole page */
        .corner-date {
            position: absolute;
            bottom: 10px;
            right: 18px;
            font-size: 1.1rem;
            font-weight: 400;
            color: rgba(255,255,255,0.50);
            letter-spacing: 0.5px;
            font-family: 'Oswald', sans-serif;
            z-index: 20;
        }

        /* ══════════════════════════════════════
           LEADERBOARD
        ══════════════════════════════════════ */
        .leaderboard-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 14px 18px 10px;
            gap: 0;
            overflow: hidden;
        }

        .leaderboard-col {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .leaderboard-col:first-child {
            border-right: var(--border);
            padding-right: 14px;
        }

        .leaderboard-col:last-child {
            padding-left: 14px;
        }

        /* Column header row (Team / Score labels) */
        .col-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px 6px 6px;
            flex-shrink: 0;
            border-bottom: 1.5px solid rgba(255,255,255,0.18);
            margin-bottom: 6px;
        }

        .col-header-label {
            font-size: 1.05rem;
            font-weight: 700;
            color: rgba(255,255,255,0.45);
            text-transform: uppercase;
            letter-spacing: 2.5px;
        }

        /* Score label width matches score cells */
        .col-header-label.score-label {
            min-width: 130px;
            text-align: right;
            padding-right: 6px;
        }

        /* Cards live here — this is the positioning anchor */
        .cards-wrap {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        /* ══════════════════════════════════════
           TEAM CARD
        ══════════════════════════════════════ */
        .team-card {
            position: absolute;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            border-radius: var(--card-radius);
            overflow: hidden;
            /* top and height set by JS */
            transition: top 1.4s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: top;
        }

        /* alternating row backgrounds — driven by rank class set in JS */
        .team-card.row-odd  { background: linear-gradient(90deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.04) 100%); }
        .team-card.row-even { background: linear-gradient(90deg, rgba(0,0,0,0.20) 0%, rgba(0,0,0,0.10) 100%); }

        /* suppress top transition during blink phase */
        .team-card.hold-pos { transition: none !important; }

        /* new team slide-in */
        .team-card.entering {
            animation: slideIn 0.5s cubic-bezier(0.2, 0.8, 0.4, 1) both;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-24px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* Rank badge */
        .rank-badge {
            flex: 0 0 70px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.25);
            font-family: 'Graduate', sans-serif;
            font-size: 2.1rem;
            color: var(--gold);
            border-right: 1.5px solid rgba(255,255,255,0.12);
            flex-shrink: 0;
        }

        .rank-1 .rank-badge { background: linear-gradient(135deg, #c99a00, #ffcc33); color: #3a0010; }
        .rank-2 .rank-badge { background: linear-gradient(135deg, #777, #ccc);       color: #111; }
        .rank-3 .rank-badge { background: linear-gradient(135deg, #7c4a1e, #cd7f32); color: #fff; }

        .rank-1 .rank-num::before { content: '🥇'; font-size: 1.8rem; }
        .rank-2 .rank-num::before { content: '🥈'; font-size: 1.8rem; }
        .rank-3 .rank-num::before { content: '🥉'; font-size: 1.8rem; }
        .rank-1 .rank-num,
        .rank-2 .rank-num,
        .rank-3 .rank-num { font-size: 0; }  /* hide number, show emoji */

        /* Team name */
        .team-name {
            flex: 1 1 auto;
            min-width: 0;
            padding: 0 20px;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: uppercase;
        }

        /* Score */
        .team-score {
            flex: 0 0 130px;
            padding-right: 6px;
            text-align: right;
            font-family: 'Graduate', sans-serif;
            font-size: 3.4rem;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255,204,51,0.45);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* loading state */
        .loading-msg {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: rgba(255,204,51,0.5);
            font-style: italic;
        }

        /* debug bar */
        .status-bar {
            display: none;
            position: absolute;
            bottom: 28px;
            right: 18px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            font-family: monospace;
            font-size: 1rem;
            padding: 4px 10px;
            border-radius: 4px;
            z-index: 30;
            letter-spacing: 0.5px;
        }

    </style>
</head>
<body>

<div class="scale-root" id="scale-root">
    <div class="page">

        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <img
                    src="https://assets-rst7.rschooltoday.com/rst7files/uploads/sites/743/2026/02/20011730/GRAYBULLDOG-scaled.png"
                    alt="Bulldog" class="header-logo"
                    onerror="this.style.display='none'">
            </div>
            <div class="header-center">
                <span class="header-title">Bulldog Olympics</span>
            </div>
            <div class="header-right">
                <div class="clock-time" id="clock-time">--:--</div>
            </div>
        </div>

        <!-- LEADERBOARD -->
        <div class="leaderboard-area">

            <div class="leaderboard-col" id="col-left">
                <div class="col-header">
                    <span class="col-header-label">Team</span>
                    <span class="col-header-label score-label">Score</span>
                </div>
                <div class="cards-wrap" id="cards-left"></div>
            </div>

            <div class="leaderboard-col" id="col-right">
                <div class="col-header">
                    <span class="col-header-label">Team</span>
                    <span class="col-header-label score-label">Score</span>
                </div>
                <div class="cards-wrap" id="cards-right"></div>
            </div>

        </div>
    </div><!-- /.page -->

    <div class="corner-date" id="clock-date"></div>
    <div class="status-bar"  id="status-bar"></div>
</div><!-- /.scale-root -->

<script>
/* =============================================================
   CONFIG
   ============================================================= */
var CONFIG = {
    // Google Apps Script Web App URL — paste your deployed URL here.
    // The token below must match the token in your Apps Script code.
    APPS_SCRIPT_URL: 'https://script.google.com/macros/s/xxxxxxxxx/exec',
    SCRIPT_TOKEN:    '',

    // Fallback: published CSV if Apps Script URL hasn't been set yet
    SHEET_CSV_URL:  'https://docs.google.com/spreadsheets/',

    POLL_INTERVAL:  10000,
    TEAM_COLUMN:    0,
    SCORE_COLUMN:   22,
    AGGREGATE_MODE: false,
    SKIP_HEADER:    true,
    LEFT_COUNT:     5,
    CARD_GAP:       5,
    DEBUG:          false,    // set false once confirmed working
    FORCE_ANIMATE:  false,    // forces animation every poll so you can verify it — set false after confirming
    DEMO_MODE:      false
};

var DEMO_TEAMS = [
    { team: 'Red Wolves',      score: 450 },
    { team: 'Blue Hawks',      score: 380 },
    { team: 'Gold Falcons',    score: 360 },
    { team: 'Silver Foxes',    score: 310 },
    { team: 'Green Gators',    score: 290 },
    { team: 'Purple Panthers', score: 265 },
    { team: 'Orange Tigers',   score: 240 },
    { team: 'White Wolves',    score: 210 },
    { team: 'Black Bears',     score: 190 },
    { team: 'Teal Dolphins',   score: 175 },
    { team: 'Silver Stars',    score: 155 }
];

/* =============================================================
   16:9 SCALE-TO-FIT
   ============================================================= */
(function () {
    var root = document.getElementById('scale-root');
    function resize() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        root.style.transform = 'scale(' + s + ')';
        root.style.left = Math.round((window.innerWidth  - 1920 * s) / 2) + 'px';
        root.style.top  = Math.round((window.innerHeight - 1080 * s) / 2) + 'px';
    }
    resize();
    window.addEventListener('resize', resize);
}());

/* =============================================================
   CLOCK
   ============================================================= */
var elTime = document.getElementById('clock-time');
var elDate = document.getElementById('clock-date');

function tickClock() {
    var now = new Date();
    elTime.textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    elDate.textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    // schedule next tick at the top of the next second
    setTimeout(tickClock, 1000 - now.getMilliseconds());
}
tickClock();

/* =============================================================
   STATE
   ============================================================= */
var prevScores   = {};   // { teamName: score }
var initialRender = true;
var lastPollTime  = 0;
var pollScheduled = false;

var cardsLeft  = document.getElementById('cards-left');
var cardsRight = document.getElementById('cards-right');

/* =============================================================
   FETCH
   ============================================================= */
function fetchScores() {
    if (CONFIG.DEMO_MODE) return Promise.resolve(shuffleDemo());

    var usingScript = CONFIG.APPS_SCRIPT_URL.indexOf('YOUR_DEPLOYMENT_ID') === -1;

    if (usingScript) {
        // Apps Script — returns JSON array, real-time, no caching, CORS-safe
        var url = CONFIG.APPS_SCRIPT_URL + '?token=' + CONFIG.SCRIPT_TOKEN + '&_=' + Date.now();
        return fetch(url, { cache: 'no-store' })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function (teams) {
                if (!Array.isArray(teams)) throw new Error('Unexpected response');
                setStatus('Script OK ' + new Date().toLocaleTimeString() + ' (' + teams.length + ' teams)');
                return teams;
            })
            .catch(function (err) {
                setStatus('Script failed: ' + err.message + ' — retrying…');
                return null;
            });
    } else {
        // Fallback: published CSV (used until Apps Script URL is configured)
        var csvUrl = CONFIG.SHEET_CSV_URL + '&_=' + Date.now();
        return fetch(csvUrl, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
            })
            .then(function (text) {
                var teams = parseCSV(text);
                setStatus('CSV OK ' + new Date().toLocaleTimeString() + ' (' + teams.length + ' teams)');
                return teams;
            })
            .catch(function (err) {
                setStatus('CSV failed: ' + err.message + ' — retrying…');
                return null;
            });
    }
}

function parseCSV(text) {
    var lines = text.trim().split(/\r?\n/);
    var start = CONFIG.SKIP_HEADER ? 1 : 0;
    var totals = {};
    for (var i = start; i < lines.length; i++) {
        var cols  = splitCSVLine(lines[i]);
        if (cols.length < 2) continue;
        var team  = (cols[CONFIG.TEAM_COLUMN]  || '').trim();
        var raw   = (cols[CONFIG.SCORE_COLUMN] || '').trim();
        var pts   = parseFloat(raw.replace(/[^0-9.\-]/g, ''));
        if (!team || isNaN(pts)) continue;
        if (CONFIG.AGGREGATE_MODE) {
            totals[team] = (totals[team] || 0) + pts;
        } else {
            totals[team] = pts;
        }
    }
    return Object.keys(totals).map(function (t) {
        return { team: t, score: totals[t] };
    });
}

function splitCSVLine(line) {
    var result = [], cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
        var c = line[i];
        if (c === '"')          { inQ = !inQ; }
        else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
        else                    { cur += c; }
    }
    result.push(cur);
    return result;
}

function shuffleDemo() {
    var teams = DEMO_TEAMS.map(function (t) { return { team: t.team, score: t.score }; });
    var i = Math.floor(Math.random() * teams.length);
    teams[i].score += Math.floor(Math.random() * 50) + 10;
    return teams;
}

/* =============================================================
   POLL LOOP  — self-scheduling setTimeout (BrightSign safe)
   ============================================================= */
function schedulePoll() {
    pollScheduled = true;
    setTimeout(function () {
        poll();
    }, CONFIG.POLL_INTERVAL);
}

function poll() {
    lastPollTime = Date.now();
    setStatus('Fetching…');
    fetchScores().then(function (teams) {
        if (teams) renderLeaderboard(teams);
        schedulePoll();   // schedule next poll AFTER this one finishes
    }).catch(function () {
        schedulePoll();
    });
}

/* =============================================================
   RENDER
   ============================================================= */
function renderLeaderboard(teams) {
    if (!teams || teams.length === 0) {
        cardsLeft.innerHTML  = '<div class="loading-msg">No scores yet…</div>';
        cardsRight.innerHTML = '';
        return;
    }

    teams.sort(function (a, b) { return b.score - a.score; });

    var leftCount  = Math.min(CONFIG.LEFT_COUNT, teams.length);
    var leftTeams  = teams.slice(0, leftCount);
    var rightTeams = teams.slice(leftCount);

    // Detect score changes
    var changed = {};
    var changedLog = [];
    teams.forEach(function (t) {
        if (prevScores[t.team] !== undefined && prevScores[t.team] !== t.score) {
            changed[t.team] = true;
            changedLog.push(t.team + ': ' + prevScores[t.team] + '→' + t.score);
        }
    });

    // FORCE_ANIMATE: mark every team as changed on every poll so you can
    // verify the animation fires. Set false once confirmed working.
    if (CONFIG.FORCE_ANIMATE && !initialRender) {
        teams.forEach(function (t) { changed[t.team] = true; });
        changedLog.push('(FORCE_ANIMATE on)');
    }

    if (initialRender) {
        buildColumn(cardsLeft,  leftTeams,  0,         false, changed);
        buildColumn(cardsRight, rightTeams, leftCount, false, changed);
        initialRender = false;
    } else {
        flipColumn(cardsLeft,  leftTeams,  0,         changed);
        flipColumn(cardsRight, rightTeams, leftCount, changed);
    }

    prevScores = {};
    teams.forEach(function (t) { prevScores[t.team] = t.score; });

    if (changedLog.length) {
        setStatus('CHANGED: ' + changedLog.join(', '));
    } else {
        setStatus('No change ' + new Date().toLocaleTimeString());
    }
}

/* =============================================================
   BUILD COLUMN  (first render, no animation)
   ============================================================= */
function buildColumn(wrap, teams, globalOffset, animate, changed) {
    wrap.innerHTML = '';
    if (!teams.length) return;

    var cardH = getCardH(wrap, teams.length);

    teams.forEach(function (t, idx) {
        var rank = globalOffset + idx + 1;
        var card = makeCard(t, rank, idx, cardH, animate);
        wrap.appendChild(card);
    });
}

/* =============================================================
   FLIP COLUMN  (subsequent renders, with animation)
   ============================================================= */
function flipColumn(wrap, newTeams, globalOffset, changed) {
    if (!newTeams.length) { wrap.innerHTML = ''; return; }

    var cardH = getCardH(wrap, newTeams.length);
    var GAP   = CONFIG.CARD_GAP;

    // Map existing cards by team
    var existing = {};
    wrap.querySelectorAll('.team-card').forEach(function (c) {
        existing[c.dataset.team] = c;
    });

    newTeams.forEach(function (t, idx) {
        var rank    = globalOffset + idx + 1;
        var newTop  = idx * (cardH + GAP);
        var rowCls  = (rank % 2 === 1) ? 'row-odd' : 'row-even';

        if (existing[t.team]) {
            var card = existing[t.team];
            card.dataset.rank = rank;
            card.querySelector('.rank-num').textContent = rank;

            if (changed[t.team]) {
                card.querySelector('.team-score').textContent = formatScore(t.score);
                animateBlink(card, rank, rowCls, cardH, newTop);
            } else {
                // just slide to new position
                card.className = 'team-card rank-' + rank + ' ' + rowCls;
                card.style.height = cardH + 'px';
                card.style.top    = newTop + 'px';
            }
            delete existing[t.team];

        } else {
            var newCard = makeCard(t, rank, idx, cardH, true);
            wrap.appendChild(newCard);
        }
    });

    // Remove any teams no longer in this column
    Object.values(existing).forEach(function (c) { c.remove(); });
}

/* =============================================================
   BLINK ANIMATION  — 3 blinks → hold → slide → restore
   Uses direct background style (overflow:hidden safe).
   ============================================================= */
function animateBlink(card, rank, rowCls, cardH, newTop) {
    var BLINK_ON  = 350;   // ms — highlight visible
    var BLINK_OFF = 250;   // ms — dark between blinks
    var HOLD_MS   = 400;   // ms — stay lit before sliding
    var SLIDE_MS  = 1400;  // ms — must match CSS transition duration

    // Very bright gold — unmissable even on a TV across the room
    var GOLD_BG = 'linear-gradient(90deg, rgba(255,204,51,0.75) 0%, rgba(255,185,0,0.55) 100%)';
    var OFF_BG  = '';  // falls back to row-odd/row-even CSS class

    // Freeze position, clear any leftover inline background
    card.className    = 'team-card rank-' + rank + ' ' + rowCls + ' hold-pos';
    card.style.height = cardH + 'px';
    card.style.background = OFF_BG;

    // Pre-calculated absolute timestamps for each flash step
    var t = 0;
    // Blink 1
    setTimeout(function() { card.style.background = GOLD_BG; }, t);
    t += BLINK_ON;
    setTimeout(function() { card.style.background = OFF_BG;  }, t);
    t += BLINK_OFF;
    // Blink 2
    setTimeout(function() { card.style.background = GOLD_BG; }, t);
    t += BLINK_ON;
    setTimeout(function() { card.style.background = OFF_BG;  }, t);
    t += BLINK_OFF;
    // Blink 3 — stays on, no off scheduled
    setTimeout(function() { card.style.background = GOLD_BG; }, t);
    t += BLINK_ON;
    // Hold, then slide
    t += HOLD_MS;
    var slideAt = t;
    setTimeout(function() {
        card.classList.remove('hold-pos');
        void card.offsetWidth;          // force reflow so CSS transition fires
        card.style.top = newTop + 'px';
    }, slideAt);

    // After slide completes, restore normal row background
    setTimeout(function() {
        card.style.background = OFF_BG;
    }, slideAt + SLIDE_MS + 200);
}

/* =============================================================
   MAKE CARD
   ============================================================= */
function makeCard(t, rank, colIdx, cardH, animate) {
    var GAP    = CONFIG.CARD_GAP;
    var rowCls = (rank % 2 === 1) ? 'row-odd' : 'row-even';
    var card   = document.createElement('div');
    card.className    = 'team-card rank-' + rank + ' ' + rowCls + (animate ? ' entering' : '');
    card.dataset.team = t.team;
    card.dataset.rank = rank;
    card.style.top    = (colIdx * (cardH + GAP)) + 'px';
    card.style.height = cardH + 'px';

    card.innerHTML =
        '<div class="rank-badge"><span class="rank-num">' + rank + '</span></div>' +
        '<div class="team-name">'  + escapeHTML(t.team)        + '</div>' +
        '<div class="team-score">' + formatScore(t.score) + '</div>';

    return card;
}

/* =============================================================
   HELPERS
   ============================================================= */
function getCardH(wrap, numRows) {
    var h = wrap.offsetHeight;   // offsetHeight is unaffected by CSS transform scale
    var GAP = CONFIG.CARD_GAP;
    // total gaps = (numRows - 1) * GAP; divide remainder among rows
    var cardH = Math.floor((h - (numRows - 1) * GAP) / numRows);
    return Math.max(cardH, 28);
}

function formatScore(n) {
    return Number(n).toLocaleString('en-US');
}

function escapeHTML(s) {
    return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setStatus(msg) {
    var el = document.getElementById('status-bar');
    if (!CONFIG.DEBUG) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.textContent   = msg;
}

/* =============================================================
   IDLE / VISIBILITY RECOVERY
   ============================================================= */

// If the tab was hidden and comes back, only reload if it's been
// idle for longer than 3× the poll interval (avoids reload on quick tab switch)
var hiddenAt = 0;
document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
        hiddenAt = Date.now();
    } else {
        var away = Date.now() - hiddenAt;
        if (hiddenAt > 0 && away > CONFIG.POLL_INTERVAL * 3) {
            location.reload();
        } else {
            // Just re-poll immediately on return
            poll();
        }
    }
});

// Watchdog: if lastPollTime is stale (poll somehow stopped), restart it
setTimeout(function watchdog() {
    var stale = Date.now() - lastPollTime;
    if (lastPollTime > 0 && stale > CONFIG.POLL_INTERVAL * 3) {
        // poll loop appears dead — restart it
        schedulePoll();
    }
    setTimeout(watchdog, CONFIG.POLL_INTERVAL * 2);
}, CONFIG.POLL_INTERVAL * 2);

// Full page reload every 6 hours for memory hygiene (BrightSign + Chrome)
setTimeout(function () { location.reload(); }, 6 * 60 * 60 * 1000);

/* =============================================================
   KICK OFF
   ============================================================= */
// Use a 500ms delay so layout is fully painted before we measure
// card heights (important on BrightSign where DOMContentLoaded fires early)
setTimeout(function () {
    poll();
}, 500);

</script>
